name: Auto Merge enhanced to Joy

on:
  push:
    branches:
      - enhanced
  schedule:
    # 选项1：每5分钟检查一次（测试用）
    - cron: '*/5 * * * *'
    # 选项2：每天 UTC 时间 14:00 执行一次（北京时间 22:00）
    - cron: "0 14 * * *"
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # 第一阶段：检查 enhanced 是否有 Joy 没有的提交
  # ========================================
  check_and_merge:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      need_merge: ${{ steps.check.outputs.need_merge }}
    steps:
      # 检出完整仓库历史
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 获取 Joy 分支（确保本地有 Joy 分支）
      - name: 获取 Joy 分支
        run: |
          git fetch origin Joy:Joy

      # 检查是否需要合并和构建
      - name: 检查是否需要合并
        id: check
        run: |
          # 获取 Joy 和 enhanced 的共同祖先
          merge_base=$(git merge-base Joy origin/enhanced)
          echo "共同祖先: $merge_base"

          # 获取 enhanced 的最新提交
          enhanced_latest=$(git rev-parse origin/enhanced)
          echo "enhanced 最新提交: $enhanced_latest"

          # 获取 Joy 的最新提交
          joy_latest=$(git rev-parse Joy)
          echo "Joy 最新提交: $joy_latest"

          # 检查 enhanced 是否有 Joy 没有的提交
          # 如果 enhanced 最新提交不是共同祖先，说明有 Joy 没有的提交
          if [ "$merge_base" != "$enhanced_latest" ]; then
            echo "need_merge=true" >> $GITHUB_OUTPUT
            echo "检测到 enhanced 有 Joy 没有的提交，需要合并"
          else
            echo "need_merge=false" >> $GITHUB_OUTPUT
            echo "enhanced 没有 Joy 没有的提交，跳过合并"
          fi

          # push 和 workflow_dispatch 事件始终执行合并和构建
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "push 事件，始终执行"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "手动触发，始终执行"
          elif [ "$merge_base" != "$enhanced_latest" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "定时任务检测到有变化，执行合并和构建"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "定时任务检测到没有变化，跳过合并和构建"
          fi

  # ========================================
  # 第二阶段：执行变基合并（仅当需要合并时）
  # ========================================
  merge-to-joy:
    runs-on: ubuntu-latest
    needs: check_and_merge
    if: needs.check_and_merge.outputs.need_merge == 'true'
    steps:
      # 检出完整仓库历史
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 配置 Git 提交者身份
      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 切换到 Joy 分支并变基到 enhanced
      - name: 执行变基合并
        run: |
          git checkout Joy
          git rebase origin/enhanced
          git push origin Joy --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # 第三阶段：构建 Nightly 版本
  # ========================================
  build_nightly:
    runs-on: windows-latest
    name: Build Nightly
    needs: [check_and_merge, merge-to-joy]
    if: needs.check_and_merge.outputs.should_run == 'true' && needs.check_and_merge.outputs.need_merge == 'true'
    outputs:
      full_sha: ${{ steps.var.outputs.full_sha }}
      short_sha: ${{ steps.var.outputs.short_sha }}
      branch: Joy  # 硬编码为 Joy 分支，确保标签名称有效
      commits: ${{ steps.commit_info.outputs.commits }}
      commit_count: ${{ steps.count.outputs.commit_count }}
    steps:
      # 检出 Joy 分支，包含子模块
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Joy  # 检出 Joy 分支
          submodules: recursive
          fetch-depth: 0

      # 配置 Git 提交者身份
      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 检查 CMake 版本
      - name: Check CMake version
        run: cmake --version

      # 设置 MSVC 编译环境
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # 生成 CMake 项目
      - name: Generate CMake project
        run: cmake -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -S . -B build -G Ninja

      # 构建 64 位 RelWithDebInfo DLL
      - name: Build 64bit RelWithDebInfo DLL
        run: cmake --build ./build --config RelWithDebInfo --target YimMenuV2 --

      # 上传 DLL 构建产物
      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimMenuV2.dll
          path: build/YimMenuV2.dll

      # 上传 PDB 调试文件
      - name: Upload PDB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimMenuV2.pdb
          path: build/YimMenuV2.pdb

      # 生成构建信息（SHA、分支等）
      - name: Generate Build Info
        id: var
        shell: bash
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 获取提交计数
      - name: Get Commit Count
        id: count
        shell: bash
        run: |
          # 确保获取提交计数，即使在分离HEAD状态
          echo "commit_count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      # 提取推送的提交信息
      - name: Extract Pushed Commits
        id: commit_info
        shell: pwsh
        run: |
          # 确保获取所有远程分支的最新信息
          git fetch --all
          git fetch --prune --unshallow

          $beforeSha = "${{ github.event.before }}"
          $afterSha = "${{ github.event.after }}"
          $repo = "${{ github.repository }}"
          $eventName = "${{ github.event_name }}"

          Write-Host "事件类型: $eventName"
          Write-Host "Before SHA: $beforeSha"
          Write-Host "After SHA: $afterSha"
          Write-Host "当前 HEAD: $(git rev-parse HEAD)"

          $formattedCommits = @()

          if ($eventName -eq "push" -and $beforeSha -ne "0000000000000000000000000000000000000000" -and $afterSha -ne "0000000000000000000000000000000000000000") {
              Write-Host "获取从 $beforeSha 到 $afterSha 的提交"
              try {
                  $commits = git rev-list --reverse "$beforeSha..$afterSha"
                  foreach ($commit in $commits) {
                      $hash = git rev-parse --short=7 $commit
                      $message = git log -1 --format="%s" $commit
                      $author = git log -1 --format="%an" $commit
                      $date = git log -1 --format="%ad" --date=short $commit

                      # 替换 # 为 - 加空格，防止 GitHub 自动识别为 issue 链接
                      $message = $message -replace '#', '- '

                      $formattedCommits += "- ${hash}: ${message} (${author}, ${date})"
                  }
              } catch {
                  Write-Host "获取提交失败: $($_.Exception.Message)"
              }
          } elseif ($eventName -eq "workflow_dispatch" -or $eventName -eq "schedule") {
              Write-Host "手动或定时触发，获取变基合并的提交"
              try {
                  # 切换到 Joy 分支
                  git checkout Joy

                  Write-Host "切换到 Joy 分支后 HEAD: $(git rev-parse HEAD)"

                  # 获取 Joy 和 enhanced 的最新提交
                  $joyLatest = git rev-parse HEAD
                  $enhancedLatest = git rev-parse origin/enhanced

                  Write-Host "Joy 最新提交: $joyLatest"
                  Write-Host "enhanced 最新提交: $enhancedLatest"

                  # 获取 Joy 和 enhanced 的共同祖先
                  $mergeBase = git merge-base HEAD origin/enhanced
                  Write-Host "共同祖先: $mergeBase"

                  # 始终从 Joy 分支获取从共同祖先开始的所有提交
                  # 变基后 enhanced 的提交会有新的 SHA，所以直接从 Joy 获取
                  Write-Host "从 Joy 分支获取从共同祖先开始的所有提交"

                  # 先添加共同祖先本身，再添加从共同祖先之后的所有提交
                  $allCommits = @()
                  $allCommits += $mergeBase
                  $newCommits = git rev-list --reverse "$mergeBase..HEAD"
                  if ($newCommits) {
                      $allCommits += ($newCommits -split "`n" | Where-Object { $_ -ne '' })
                  }
                  $commits = $allCommits

                  Write-Host "找到 $($commits.Count) 个提交"

                  foreach ($commit in $commits) {
                      $hash = git rev-parse --short=7 $commit
                      $message = git log -1 --format="%s" $commit
                      $author = git log -1 --format="%an" $commit
                      $date = git log -1 --format="%ad" --date=short $commit

                      # 替换 # 为 - 加空格，防止 GitHub 自动识别为 issue 链接
                      $message = $message -replace '#', '- '

                      $formattedCommits += "- ${hash}: ${message} (${author}, ${date})"
                  }

                  # 如果还是没有找到提交，使用备用方案获取 enhanced 分支的所有提交
                  if ($formattedCommits.Count -eq 0) {
                      Write-Host "备用方案：获取 enhanced 分支从共同祖先开始的所有提交"
                      $commits = git rev-list --reverse "$mergeBase..origin/enhanced"
                      Write-Host "备用方案找到 $($commits.Count) 个提交"

                      foreach ($commit in $commits) {
                          $hash = git rev-parse --short=7 $commit
                          $message = git log -1 --format="%s" $commit
                          $author = git log-1 --format="%an" $commit
                          $date = git log -1 --format="%ad" --date=short $commit

                          $message = $message -replace '#', '- '
                          $formattedCommits += "- ${hash}: ${message} (${author}, ${date})"
                      }
                  }
              } catch {
                  Write-Host "获取变基提交失败: $($_.Exception.Message)"
              }
          }

          if ($formattedCommits.Count -eq 0) {
              Write-Host "未找到提交，保持提交记录为空"
          }

          $commitMessage = $formattedCommits -join "`n"
          Write-Host "提交信息:"
          Write-Host $commitMessage

          # 在 PowerShell 中使用正确的环境变量语法
          echo "commits<<EOF" >> $env:GITHUB_OUTPUT
          echo "$commitMessage" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

  # ========================================
  # 第四阶段：创建/更新 Release 发布
  # ========================================
  recreate_release:
    runs-on: ubuntu-latest
    name: Recreate Release
    needs: build_nightly
    if: needs.check_and_merge.outputs.should_run == 'true'
    steps:
      # 检出构建时的特定提交
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build_nightly.outputs.full_sha }}
          fetch-depth: 0

      # 删除现有的 nightly 发布和标签
      - name: Delete Existing Release (nightly)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "${{ needs.build_nightly.outputs.branch }}";
            const tag = `nightly-${branch}`;
            const releases = await github.rest.repos.listReleases({ owner, repo });
            const release = releases.data.find(r => r.tag_name === tag);
            if (release) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              console.log(`No existing ${tag} tag to delete`);
            }

      # 下载 DLL 构建产物
      - name: Download DLL Artifact
        uses: actions/download-artifact@v4
        with:
          name: YimMenuV2.dll

      # 下载 PDB 调试文件
      - name: Download PDB Artifact
        uses: actions/download-artifact@v4
        with:
          name: YimMenuV2.pdb

      # 生成 SHA256 校验和
      - name: Echo build sha256
        id: build_sha
        run: |
          sha256sum YimMenuV2.dll > sha256.checksum
          echo "build_sha=$(cat sha256.checksum)" >> $GITHUB_OUTPUT
          cat sha256.checksum

      # ========================================
      # 创建最新版本发布（nightly-joy 或 nightly-enhanced）
      # ========================================
      - name: Nightly Release (latest)
        uses: softprops/action-gh-release@v2.2.2
        with:
          name: Nightly [${{ needs.build_nightly.outputs.short_sha }}] (push - ${{ needs.build_nightly.outputs.branch }})
          tag_name: nightly-${{ needs.build_nightly.outputs.branch }}
          target_commitish: ${{ needs.build_nightly.outputs.full_sha }}
          body: |
            [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Latest nightly build**
            Branch: `${{ needs.build_nightly.outputs.branch }}`
            Trigger: `${{ github.event_name }}`
            Commit: `${{ needs.build_nightly.outputs.full_sha }}`

            Build SHA256:
            ```
            ${{ steps.build_sha.outputs.build_sha }}
            ```

            To verify the build SHA256 during the action, click the build link, go-to "Recreate Release", open the "Echo build sha256" step and read the sha256.

            You can download the build artifacts, generate a SHA256 checksum and compare it with the below binary.
            Build artifacts ARE NOT automatically the same as release assets since release assets can be modified afterwards.

            These are nightly builds of YimMenuV2, they are provided for testing purposes only:
            - Test if your build environment produces a broken YimMenuV2.dll
            - Test if source code is out of date and no longer compatible with the current version of Grand Theft Auto V: Enhanced

            If you wish to use this menu as-is you are on your own, no warranty is provided.
          files: |
            YimMenuV2.dll
            YimMenuV2.pdb

      # ========================================
      # 创建归档版本发布（包含完整提交列表）
      # ========================================
      - name: Nightly Release (archived)
        uses: softprops/action-gh-release@v2.2.2
        with:
          name: Nightly Archive [${{ needs.build_nightly.outputs.commit_count }}] (${{ needs.build_nightly.outputs.branch }})
          tag_name: nightly-${{ needs.build_nightly.outputs.branch }}-${{ needs.build_nightly.outputs.commit_count }}
          target_commitish: ${{ needs.build_nightly.outputs.full_sha }}
          body: |
            [Link to build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Archived nightly build**
            Branch: `${{ needs.build_nightly.outputs.branch }}`
            Trigger: `${{ github.event_name }}`
            Commit: `${{ needs.build_nightly.outputs.full_sha }}`

            Build SHA256:
            ```
            ${{ steps.build_sha.outputs.build_sha }}
            ```

            **Commits in this push**

            ${{ needs.build_nightly.outputs.commits }}
          files: |
            YimMenuV2.dll
            YimMenuV2.pdb